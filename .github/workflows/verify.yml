name: build-and-test

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The same verification on both OSes catches wrapper, path and line-ending issues.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test, and verify (Linux)
        if: runner.os != 'Windows'
        run: ./mvnw -B --no-transfer-progress clean verify

      - name: Build, test, and verify (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\mvnw.cmd -B --no-transfer-progress clean verify

      - name: Upload Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports-${{ matrix.os }}
          path: '**/target/surefire-reports/*'
          if-no-files-found: warn
          retention-days: 7
