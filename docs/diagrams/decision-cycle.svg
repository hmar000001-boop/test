<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720">
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#455a70"/></marker></defs><rect width="900" height="720" fill="#fbfcfe" rx="18"/>
<text x="450" y="34" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#17334c">The outer CoALA decision cycle</text>
<rect x="275" y="62" width="350" height="62" rx="12" fill="#e4effb" stroke="#7798c2" stroke-width="1.5"/><text x="450" y="87" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#17334c">Observation</text><text x="450" y="107" text-anchor="middle" font-family="Arial" font-size="12" fill="#17334c">Incorporate outcome from prior action</text>
<path d="M450 124 V152" stroke="#455a70" stroke-width="2" marker-end="url(#arr)"/>
<rect x="200" y="155" width="500" height="82" rx="12" fill="#ddf3eb" stroke="#529c85" stroke-width="1.5"/><text x="450" y="181" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#154d40">Planning stage</text><text x="450" y="202" text-anchor="middle" font-family="Arial" font-size="13" fill="#154d40">Reasoning and retrieval may propose, evaluate, select</text><text x="450" y="220" text-anchor="middle" font-family="Arial" font-size="12" fill="#154d40">May be direct, iterative, or explicitly search-based</text>
<path d="M450 237 V265" stroke="#455a70" stroke-width="2" marker-end="url(#arr)"/>
<rect x="275" y="268" width="350" height="62" rx="12" fill="#fff0d9" stroke="#d8a454" stroke-width="1.5"/><text x="450" y="293" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#6b4513">Selected action</text><text x="450" y="313" text-anchor="middle" font-family="Arial" font-size="12" fill="#6b4513">Structured action ID + validated arguments</text>
<path d="M450 330 V358" stroke="#455a70" stroke-width="2" marker-end="url(#arr)"/>
<rect x="275" y="361" width="350" height="62" rx="12" fill="#fbe7e7" stroke="#c77b7b" stroke-width="1.5"/><text x="450" y="386" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#7a2929">Execution</text><text x="450" y="406" text-anchor="middle" font-family="Arial" font-size="12" fill="#7a2929">Registered grounding or learning action only</text>
<path d="M450 423 V451" stroke="#455a70" stroke-width="2" marker-end="url(#arr)"/>
<rect x="275" y="454" width="350" height="62" rx="12" fill="#e9e3fa" stroke="#9b86d0" stroke-width="1.5"/><text x="450" y="479" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#483675">Incorporate result</text><text x="450" y="499" text-anchor="middle" font-family="Arial" font-size="12" fill="#483675">Update active working memory / observation</text>
<path d="M625 485 H772 V92 H630" fill="none" stroke="#455a70" stroke-width="2" marker-end="url(#arr)"/><text x="789" y="292" transform="rotate(90 789 292)" text-anchor="middle" font-family="Arial" font-size="13" fill="#455a70">Continue until terminal condition or cycle limit</text>
<path d="M275 485 H125 V574" fill="none" stroke="#455a70" stroke-width="2" marker-end="url(#arr)"/>
<rect x="30" y="578" width="190" height="70" rx="10" fill="#edf1f5" stroke="#91a0ae"/><text x="125" y="603" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#314354">Stop / return</text><text x="125" y="623" text-anchor="middle" font-family="Arial" font-size="11" fill="#314354">Terminal result or limit</text>
<rect x="270" y="578" width="600" height="70" rx="10" fill="#f3f6f9" stroke="#c0cad4"/><text x="570" y="602" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#314354">Core invariants implemented in this project</text><text x="570" y="623" text-anchor="middle" font-family="Arial" font-size="12" fill="#314354">Per-run working memory · allow-listed actions · bounds · structured trace · no model-generated code execution</text>
<text x="450" y="688" text-anchor="middle" font-family="Arial" font-size="12" fill="#556778">The loop is one software realization of the paper's decision procedure, not a mandatory Java class hierarchy.</text>
</svg>
