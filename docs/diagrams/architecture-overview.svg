<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640">
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#41556b"/></marker></defs>
<rect width="980" height="640" rx="18" fill="#f7f9fc"/>
<text x="490" y="34" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#18324b">CoALA framework: paper concepts and implementation boundaries</text>
<rect x="30" y="60" width="920" height="78" rx="12" fill="#e6eef9" stroke="#7694bd" stroke-width="1.5"/>
<text x="490" y="86" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#18324b">Use-case assembly / application shell</text><text x="490" y="111" text-anchor="middle" font-family="Arial" font-size="13" fill="#18324b">CoalaAgentDefinition · CoalaAgent · HTTP API · configured actions and procedure</text>
<path d="M490 138 V163" stroke="#41556b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="30" y="166" width="920" height="90" rx="12" fill="#dff3ec" stroke="#4b9b83" stroke-width="1.5"/>
<text x="490" y="193" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#174f43">CoalaAgent / CoalaDecisionProcedure</text><text x="490" y="219" text-anchor="middle" font-family="Arial" font-size="13" fill="#174f43">Repeated cycle: observe → plan → execute → incorporate result → next cycle</text><text x="490" y="239" text-anchor="middle" font-family="Arial" font-size="12" fill="#174f43">Cycle bounds · completion/failure reporting · trace listeners</text>
<path d="M490 256 V280" stroke="#41556b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="30" y="283" width="445" height="145" rx="12" fill="#fff0d9" stroke="#d6a04d" stroke-width="1.5"/>
<text x="252" y="310" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#6e4511">Planning implementations</text><text x="55" y="338" font-family="Arial" font-size="13" fill="#6e4511">• Direct action generation</text><text x="55" y="360" font-family="Arial" font-size="13" fill="#6e4511">• Iterative reason-and-act</text><text x="55" y="382" font-family="Arial" font-size="13" fill="#6e4511">• Proposal/evaluation/selection</text><text x="55" y="404" font-family="Arial" font-size="13" fill="#6e4511">• Plan-first, refinement, optional search</text>
<rect x="505" y="283" width="445" height="145" rx="12" fill="#e9e3fa" stroke="#9782cc" stroke-width="1.5"/>
<text x="727" y="310" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#493875">AgentContext</text><text x="530" y="338" font-family="Arial" font-size="13" fill="#493875">• WorkingMemory (active, per run)</text><text x="530" y="360" font-family="Arial" font-size="13" fill="#493875">• LongTermMemory (scoped store)</text><text x="530" y="382" font-family="Arial" font-size="13" fill="#493875">• namespace / session / principal labels</text><text x="530" y="404" font-family="Arial" font-size="13" fill="#493875">• cycle and observation state</text>
<path d="M252 428 V450 H240 V468" fill="none" stroke="#41556b" stroke-width="2" marker-end="url(#arr)"/><path d="M727 428 V450 H740 V468" fill="none" stroke="#41556b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="30" y="472" width="445" height="116" rx="12" fill="#fce7e7" stroke="#c67878" stroke-width="1.5"/>
<text x="252" y="499" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#7b2929">Registered action space</text><text x="55" y="526" font-family="Arial" font-size="13" fill="#7b2929">GroundingAction · LearningAction</text><text x="55" y="548" font-family="Arial" font-size="13" fill="#7b2929">ActionRegistry validates ID and arguments</text><text x="55" y="570" font-family="Arial" font-size="13" fill="#7b2929">Execution decorators / optional approval</text>
<rect x="505" y="472" width="445" height="116" rx="12" fill="#e0f2fe" stroke="#6aa7ce" stroke-width="1.5"/>
<text x="727" y="499" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#174a67">Internal actions and providers</text><text x="530" y="526" font-family="Arial" font-size="13" fill="#174a67">ReasoningAction · RetrievalAction · Learning</text><text x="530" y="548" font-family="Arial" font-size="13" fill="#174a67">MemoryRetriever / context assembly</text><text x="530" y="570" font-family="Arial" font-size="13" fill="#174a67">LanguageModel → SpringAiLanguageModel (OpenAI)</text>
<text x="490" y="618" text-anchor="middle" font-family="Arial" font-size="12" fill="#556778">CoALA semantics are the conceptual model; Java classes, API controls and retry budgets are implementation choices.</text>
</svg>
