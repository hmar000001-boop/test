<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500">
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4a6073"/></marker></defs><rect width="980" height="500" rx="16" fill="#fbfcfe"/><text x="490" y="32" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#18324b">Memory flow: retrieval, context assembly and learning</text>
<rect x="35" y="72" width="255" height="92" rx="12" fill="#e6eef9" stroke="#7595bc"/><text x="162" y="99" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#18324b">Long-term memory</text><text x="162" y="122" text-anchor="middle" font-family="Arial" font-size="12" fill="#18324b">Episodic + semantic records</text><text x="162" y="141" text-anchor="middle" font-family="Arial" font-size="11" fill="#18324b">Namespace · time · type · importance</text>
<path d="M290 118 H337" stroke="#4a6073" stroke-width="2" marker-end="url(#arr)"/><rect x="340" y="72" width="270" height="92" rx="12" fill="#ddf3eb" stroke="#529c85"/><text x="475" y="99" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#154d40">MemoryRetriever</text><text x="475" y="122" text-anchor="middle" font-family="Arial" font-size="12" fill="#154d40">Lexical / weighted / hybrid</text><text x="475" y="141" text-anchor="middle" font-family="Arial" font-size="11" fill="#154d40">Dense retrieval requires adapters</text>
<path d="M610 118 H657" stroke="#4a6073" stroke-width="2" marker-end="url(#arr)"/><rect x="660" y="72" width="285" height="92" rx="12" fill="#fff0d9" stroke="#d6a04d"/><text x="802" y="99" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#6e4511">MemoryContextAssembler</text><text x="802" y="122" text-anchor="middle" font-family="Arial" font-size="12" fill="#6e4511">Bounded records + provenance</text><text x="802" y="141" text-anchor="middle" font-family="Arial" font-size="11" fill="#6e4511">Writes selected memories to working memory</text>
<path d="M802 164 V198 H620" fill="none" stroke="#4a6073" stroke-width="2" marker-end="url(#arr)"/><rect x="345" y="202" width="275" height="82" rx="12" fill="#e9e3fa" stroke="#9782cc"/><text x="482" y="229" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#493875">Working memory</text><text x="482" y="251" text-anchor="middle" font-family="Arial" font-size="12" fill="#493875">Active, per-run symbolic state</text><text x="482" y="269" text-anchor="middle" font-family="Arial" font-size="11" fill="#493875">Prompt builder selects safe keys</text>
<path d="M482 284 V320 H280 V350" fill="none" stroke="#4a6073" stroke-width="2" marker-end="url(#arr)"/><path d="M482 320 H700 V350" fill="none" stroke="#4a6073" stroke-width="2" marker-end="url(#arr)"/>
<rect x="50" y="354" width="460" height="93" rx="12" fill="#fce7e7" stroke="#c67878"/><text x="280" y="380" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#7b2929">Episodic learning</text><text x="280" y="403" text-anchor="middle" font-family="Arial" font-size="12" fill="#7b2929">Record bounded run experience, outcome and provenance</text><text x="280" y="423" text-anchor="middle" font-family="Arial" font-size="11" fill="#7b2929">Completion listener may write episode to episodic memory</text>
<rect x="540" y="354" width="400" height="93" rx="12" fill="#e7f3fa" stroke="#6aa7ce"/><text x="740" y="380" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#174a67">Semantic / reflection learning</text><text x="740" y="403" text-anchor="middle" font-family="Arial" font-size="12" fill="#174a67">Explicitly store normalized facts or selected reflection</text><text x="740" y="423" text-anchor="middle" font-family="Arial" font-size="11" fill="#174a67">Not autonomous model self-modification</text>
<path d="M280 354 V320 H160 V164" fill="none" stroke="#4a6073" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)"/><path d="M740 354 V305 H840 V164" fill="none" stroke="#4a6073" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)"/>
<text x="490" y="480" text-anchor="middle" font-family="Arial" font-size="11" fill="#667789">Store, retrieve, context assembly and retention are separate so use cases can compose them.</text></svg>
