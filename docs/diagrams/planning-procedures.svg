<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430">
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#506274"/></marker></defs><rect width="1100" height="430" rx="18" fill="#fbfcfe"/><text x="550" y="32" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#18324b">Optional planning implementations share the same outer cycle</text>
<rect x="24" y="64" width="330" height="276" rx="13" fill="#e4effb" stroke="#7798c2" stroke-width="1.5"/><text x="189" y="91" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#18324b">Direct / iterative</text><rect x="62" y="117" width="254" height="48" rx="8" fill="#ffffff" stroke="#94b0cf"/><text x="189" y="146" text-anchor="middle" font-family="Arial" font-size="13" fill="#18324b">Reason about next action</text><path d="M189 165 V189" stroke="#506274" stroke-width="1.5" marker-end="url(#arr)"/><rect x="62" y="192" width="254" height="48" rx="8" fill="#ffffff" stroke="#94b0cf"/><text x="189" y="221" text-anchor="middle" font-family="Arial" font-size="13" fill="#18324b">Select / propose action</text><path d="M189 240 V264" stroke="#506274" stroke-width="1.5" marker-end="url(#arr)"/><rect x="62" y="267" width="254" height="48" rx="8" fill="#ffffff" stroke="#94b0cf"/><text x="189" y="296" text-anchor="middle" font-family="Arial" font-size="13" fill="#18324b">Execute → observe → repeat</text>
<rect x="385" y="64" width="330" height="276" rx="13" fill="#ddf3eb" stroke="#529c85" stroke-width="1.5"/><text x="550" y="91" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#154d40">Deliberative</text><rect x="426" y="117" width="248" height="42" rx="8" fill="#ffffff" stroke="#7db7a5"/><text x="550" y="143" text-anchor="middle" font-family="Arial" font-size="13" fill="#154d40">Propose candidate set</text><path d="M550 159 V179" stroke="#506274" stroke-width="1.5" marker-end="url(#arr)"/><rect x="426" y="182" width="248" height="42" rx="8" fill="#ffffff" stroke="#7db7a5"/><text x="550" y="208" text-anchor="middle" font-family="Arial" font-size="13" fill="#154d40">Evaluate / may reject all</text><path d="M550 224 V244" stroke="#506274" stroke-width="1.5" marker-end="url(#arr)"/><rect x="426" y="247" width="248" height="42" rx="8" fill="#ffffff" stroke="#7db7a5"/><text x="550" y="273" text-anchor="middle" font-family="Arial" font-size="13" fill="#154d40">Select or re-propose</text><path d="M426 268 H401 V138 H426" fill="none" stroke="#506274" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/><text x="550" y="320" text-anchor="middle" font-family="Arial" font-size="11" fill="#154d40">Re-proposal has configurable retry bound</text>
<rect x="746" y="64" width="330" height="276" rx="13" fill="#fff0d9" stroke="#d6a04d" stroke-width="1.5"/><text x="911" y="91" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#6e4511">Plan-first / search</text><rect x="786" y="117" width="250" height="42" rx="8" fill="#ffffff" stroke="#e0b76f"/><text x="911" y="143" text-anchor="middle" font-family="Arial" font-size="13" fill="#6e4511">Build plan or simulated tree</text><path d="M911 159 V179" stroke="#506274" stroke-width="1.5" marker-end="url(#arr)"/><rect x="786" y="182" width="250" height="42" rx="8" fill="#ffffff" stroke="#e0b76f"/><text x="911" y="208" text-anchor="middle" font-family="Arial" font-size="13" fill="#6e4511">Validate registered first action</text><path d="M911 224 V244" stroke="#506274" stroke-width="1.5" marker-end="url(#arr)"/><rect x="786" y="247" width="250" height="42" rx="8" fill="#ffffff" stroke="#e0b76f"/><text x="911" y="273" text-anchor="middle" font-family="Arial" font-size="13" fill="#6e4511">Execute only via outer loop</text><text x="911" y="320" text-anchor="middle" font-family="Arial" font-size="11" fill="#6e4511">Search domains must simulate without side effects</text>
<text x="550" y="385" text-anchor="middle" font-family="Arial" font-size="13" fill="#455a70">These are reusable implementation templates, not three new kinds of memory or mandatory CoALA layers.</text><text x="550" y="407" text-anchor="middle" font-family="Arial" font-size="11" fill="#6b7785">One shared outer procedure owns execution and observation updates.</text></svg>
